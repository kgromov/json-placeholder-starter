version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
    ignore:
      # skip major upgrades
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]